# Zet de app (boeken, dashboard, betalingen) op Cloudflare Workers bij elke push naar main.
#
# Waarom via GitHub en niet via Cloudflare's eigen Git-koppeling: die koppeling moet aan
# twee kanten kloppen en valt geregeld stil ("Missing git connection"). Hier duwt GitHub
# de build naar Cloudflare in plaats van dat Cloudflare hem komt halen — één richting,
# één plek om te kijken als er iets misgaat.
#
# Eenmalig instellen, in de repo onder Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → Create Token
#                          → sjabloon "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  staat in het adres van je Cloudflare-dashboard
#
# De omgevingsvariabelen van de app zelf (DATABASE_URL, STRIPE_SECRET_KEY, …) zet je
# NIET hier, maar in Cloudflare bij de Worker onder Settings → Variables and Secrets.
# Zo staan je sleutels op één plek en komen ze nooit in een buildlog terecht.
name: App naar Cloudflare Workers
on:
  push:
    branches: [main]
    # De website staat op GitHub Pages en heeft zijn eigen workflow; die wijzigingen
    # hoeven de app niet opnieuw uit te rollen.
    paths-ignore:
      - "vendor/**"
      - "scripts/patch-site.mjs"
      - "scripts/site-content.json"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: app-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Controleren
        run: |
          npm run typecheck
          npm test
      - name: Bouwen voor Workers
        run: npm run build:vinext
      - name: Uitrollen
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
