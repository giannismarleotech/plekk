# Zet de marketingsite op GitHub Pages bij elke push naar main.
# De site staat als archief in vendor/ en wordt hier uitgepakt en gepubliceerd.
# Eenmalig in de repo: Settings → Pages → Source: "GitHub Actions".
name: Website naar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Site uitpakken en opkuisen
        run: |
          # Zelfde stappen als bij de app-build: uitpakken, dan de correcties
          # (adressen, teksten, juridische pagina's, sitemap) uit scripts/patch-site.mjs.
          node scripts/unpack-site.mjs
          node scripts/patch-site.mjs
          mkdir -p out
          cp -r public/. out/
          # Eigen domein: zonder dit bestand serveert GitHub op /plekk en breken de paden.
          echo "plekk.marleo.tech" > out/CNAME
          # GitHub mag de mappen niet als Jekyll-project behandelen.
          touch out/.nojekyll
          # Zonder deze regel krijgen bezoekers van een onbekend pad de standaardpagina van GitHub.
          cp out/nl/index.html out/404.html
          # De wortel stuurt door naar de taal van de bezoeker.
          cp out/nl/index.html out/index.html
          echo "Pagina's: $(find out -name '*.html' | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
